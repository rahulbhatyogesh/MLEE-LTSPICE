[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit2spice"
version = "0.1.0"
description = "Hand-drawn circuit schematics to LTspice, via YOLO symbol detection and wire tracing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "scikit-image>=0.22",
  "scikit-learn>=1.4",
  "networkx>=3.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
detect = ["ultralytics>=8.3", "torch>=2.2"]
report = ["python-docx>=1.1"]
data = ["huggingface_hub>=0.23"]

[project.scripts]
circuit2spice = "circuit2spice.cli:main"

[project.gui-scripts]
circuit2spice-gui = "circuit2spice.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
